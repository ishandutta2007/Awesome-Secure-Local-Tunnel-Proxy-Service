<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#primaryGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 12px;
      fill: #cbd5e1;
    }

    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(8px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes tunnelWave {
      0% { r: 18px; opacity: 0.9; }
      100% { r: 75px; opacity: 0; }
    }

    .pulse-bg {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .anim-dash {
      stroke-dasharray: 12, 12;
      animation: dashMove 14s linear infinite;
    }
    .anim-dash-reverse {
      stroke-dasharray: 8, 8;
      animation: dashMove 10s linear infinite reverse;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 3s; }

    .wave-ring-1 {
      animation: tunnelWave 3s cubic-bezier(0.1, 0.4, 0.6, 1) infinite;
      transform-origin: 1040px 210px;
    }
    .wave-ring-2 {
      animation: tunnelWave 3s cubic-bezier(0.1, 0.4, 0.6, 1) infinite 1.5s;
      transform-origin: 1040px 210px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.15">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="1040" cy="210" r="160" fill="#6366f1" filter="url(#glow)" class="pulse-bg" />
  <circle cx="200" cy="80" r="110" fill="#0284c7" filter="url(#glow)" class="pulse-bg" style="animation-delay: 2s;" />

  <!-- Dynamic Tunnel Pathways (Deep Background Right) -->
  <g>
    <!-- Wave emission from right hub -->
    <circle class="wave-ring-1" cx="1040" cy="210" r="20" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle class="wave-ring-2" cx="1040" cy="210" r="20" fill="none" stroke="#818cf8" stroke-width="2" />

    <!-- Animated Data Stream Curves -->
    <path d="M 720,290 C 850,290 890,210 1040,210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" class="anim-dash" />
    <path d="M 740,130 C 860,130 900,210 1040,210" fill="none" stroke="#c084fc" stroke-width="3" stroke-opacity="0.4" class="anim-dash-reverse" />
    <path d="M 680,210 C 800,210 920,210 1040,210" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="6,6" />

    <!-- Localhost Node -->
    <rect x="680" y="185" width="130" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="745" y="216" text-anchor="middle" class="tag-text">localhost:PORT</text>

    <!-- Cloud Gateway / Edge Node -->
    <circle cx="1040" cy="210" r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" filter="url(#softGlow)" />
    <!-- Lock / Gateway Icon -->
    <path d="M 1034,204 L 1034,200 C 1034,196.7 1036.7,194 1040,194 C 1043.3,194 1046,196.7 1046,200 L 1046,204 Z M 1031,204 L 1049,204 C 1050.1,204 1051,204.9 1051,206 L 1051,220 C 1051,221.1 1050.1,222 1049,222 L 1031,222 C 1029.9,222 1029,221.1 1029,220 L 1029,206 C 1029,204.9 1029.9,204 1031,204 Z" fill="#38bdf8" />

    <!-- Public Internet Tag -->
    <rect x="980" y="260" width="120" height="28" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="1040" y="279" text-anchor="middle" class="tag-text" fill="#94a3b8">PUBLIC EDGE</text>
  </g>

  <!-- Floating Particles for High-Tech Feel -->
  <circle cx="790" cy="150" r="3" fill="#38bdf8" class="particle-1" />
  <circle cx="940" cy="180" r="4" fill="#818cf8" class="particle-2" />
  <circle cx="860" cy="270" r="3.5" fill="#c084fc" class="particle-3" />
  <circle cx="990" cy="130" r="2.5" fill="#38bdf8" class="particle-1" />

  <!-- Foreground Content Block (Left Aligned, Clear & Unobstructed) -->
  <g transform="translate(60, 50)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" class="badge-text">⚡ CURATED REVERSE PROXIES &amp; TUNNELS</text>

    <!-- Main Title -->
    <text x="0" y="95" class="title-text">Secure Local Tunnel</text>
    <text x="0" y="145" class="title-text">&amp; Proxy Services 🚀</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="195" class="subtitle-text">The definitive guide &amp; benchmark to exposing localhost safely.</text>
    <text x="0" y="225" class="subtitle-text">Commercial SaaS platforms, Zero-Trust ingress, and high-performance open-source tools.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="21" text-anchor="middle" class="tag-text" fill="#38bdf8">🔒 Zero-Trust</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="210" y="21" text-anchor="middle" class="tag-text" fill="#a7f3d0">🪝 Webhook QA</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="365" y="21" text-anchor="middle" class="tag-text" fill="#fbcfe8">🌐 Self-Hostable</text>

      <!-- Pill 4 -->
      <rect x="450" y="0" width="135" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="517" y="21" text-anchor="middle" class="tag-text" fill="#fde047">⚡ NAT Traversal</text>
    </g>
  </g>
</svg>